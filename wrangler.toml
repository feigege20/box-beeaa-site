name = "box-beeaa-site"
compatibility_date = "2026-07-29"
pages_build_output_dir = "./dist-pages"

# R2 buckets for Phase 2 (B-en long-tail + Chinese)
# These bindings are exposed to Pages Functions via context.env
[[r2_buckets]]
binding = "BOX_EN_B"
bucket_name = "box-en-b"
preview_bucket_name = "box-en-b"

[[r2_buckets]]
binding = "BOX_ZH"
bucket_name = "box-zh"
preview_bucket_name = "box-zh"

# === 2026-09-01 v2: 关闭 Workers Paid, 切换到 CF Pages Free + R2 + D1 ===
# 删除 [ai] / [placement] / [vars] 三段 (Workers AI 已无调用方 / Smart Placement 需 Paid)
# 保留 R2 + D1 bindings (Pages Free 仍可用)
# OEM 询盘改 mailto: (已在 8/30 部署, /oem/ 页用 mailto:kexin@beeaa.com)

# === D1 Database 询盘持久化 (2026-08-18 启用, 免费层 5GB / 5M rows read/day) ===
# D1 created via Cloudflare API on 2026-08-18 02:28
[[d1_databases]]
binding = "DB"
database_name = "box-beeaa-inquiries"
database_id = "2e645789-47e9-47c6-8f7f-b5fb0341386f"
preview_database_id = "2e645789-47e9-47c6-8f7f-b5fb0341386f"
migrations_dir = "schema"

# === 4 New R2 Buckets for Multi-Language (2026-08-18 启用) ===
# DE/ES/FR/JA translations
[[r2_buckets]]
binding = "BUCKET_DE"
bucket_name = "box-de"
preview_bucket_name = "box-de"

[[r2_buckets]]
binding = "BUCKET_ES"
bucket_name = "box-es"
preview_bucket_name = "box-es"

[[r2_buckets]]
binding = "BUCKET_FR"
bucket_name = "box-fr"
preview_bucket_name = "box-fr"

[[r2_buckets]]
binding = "BUCKET_JA"
bucket_name = "box-ja"
preview_bucket_name = "box-ja"

