<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow" />
<title>Disney Film Production Case - 2 candidates</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #F8FAFC; color: #0F172A; margin: 0; padding: 0; }
  header { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 1.5rem; }
  h1 { margin: 0 0 0.5rem; }
  .meta { color: #64748B; font-size: 0.9rem; }
  main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
  .candidate { background: #fff; border: 2px solid #E2E8F0; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .candidate.selected { border-color: #10B981; }
  .candidate h2 { margin: 0 0 0.5rem; font-size: 1.3rem; }
  .candidate img { width: 100%; height: auto; border-radius: 8px; display: block; margin: 1rem 0; background: #F1F5F9; }
  .candidate p { color: #475569; line-height: 1.6; }
  .actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
  .actions button { flex: 1; padding: 0.75rem; border: 1px solid #E2E8F0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; }
  .actions button.pick { background: #10B981; color: #fff; border-color: #10B981; }
  .actions button.reject { background: #EF4444; color: #fff; border-color: #EF4444; }
  .export { width: 100%; height: 200px; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; padding: 0.75rem; border: 1px solid #E2E8F0; border-radius: 6px; display: none; }
  .toast { position: fixed; bottom: 2rem; right: 2rem; background: #0F172A; color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🎬 Disney Film Production Case - 2 Candidates</h1>
  <div class="meta">Target: /case-studies/disney-film-production-case/ · 选 1 张 (或 reject 全部让我重生成)</div>
</header>
<main>
  <div class="candidate" id="card-disney-set">
    <h2>候选 A: 摄影棚全景 <code style="font-size:0.85rem;color:#64748B;">disney-set</code></h2>
    <p><strong>场景</strong>:专业电影摄影棚,大型数字电影摄影机 + 跟焦器 + 专业 HMI 灯 + 绿幕 + 导演椅 + 场记板 + 监视器</p>
    <img src="/admin/images/disney-set-1600w.webp" alt="disney-set 1600w" />
    <div class="actions">
      <button class="pick" onclick="pickCandidate('disney-set')">✓ Pick This (选这个)</button>
      <button class="reject" onclick="rejectCandidate('disney-set')">✗ Reject (不要这个)</button>
    </div>
  </div>

  <div class="candidate" id="card-disney-camera">
    <h2>候选 B: 摄影机特写 <code style="font-size:0.85rem;color:#64748B;">disney-camera</code></h2>
    <p><strong>场景</strong>:电影摄影机特写 + 遮光斗 + 跟焦环 + LED 灯 + 挑杆麦克风 + 置景 + 苹果箱 + 影视柔光</p>
    <img src="/admin/images/disney-camera-1600w.webp" alt="disney-camera 1600w" />
    <div class="actions">
      <button class="pick" onclick="pickCandidate('disney-camera')">✓ Pick This (选这个)</button>
      <button class="reject" onclick="rejectCandidate('disney-camera')">✗ Reject (不要这个)</button>
    </div>
  </div>

  <div style="text-align:center;margin:2rem 0;">
    <button onclick="exportDecisions()" style="padding:0.75rem 2rem;background:#0F172A;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:1rem;font-weight:600;">📋 Export Decision (JSON)</button>
  </div>

  <textarea class="export" id="exportBox" readonly></textarea>
</main>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY = "disney_review_decisions";
let decisions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

function pickCandidate(name) {
  decisions[name] = "picked";
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  document.getElementById("card-" + name).classList.add("selected");
  showToast("✓ 选了 " + name);
}

function rejectCandidate(name) {
  decisions[name] = "rejected";
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  showToast("✗ 拒了 " + name);
}

function exportDecisions() {
  const output = {
    generated_at: new Date().toISOString(),
    target: "disney-film-production-case",
    candidates: ["disney-set", "disney-camera"],
    decisions: decisions,
    picked: Object.entries(decisions).filter(([k,v]) => v === "picked").map(([k]) => k),
    rejected: Object.entries(decisions).filter(([k,v]) => v === "rejected").map(([k]) => k),
    next_action: "if picked -> upload to R2 + update 4 HTML pages; if both rejected -> regenerate"
  };
  const json = JSON.stringify(output, null, 2);
  const box = document.getElementById("exportBox");
  box.value = json;
  box.style.display = "block";
  navigator.clipboard.writeText(json).then(() => showToast("Copied! Paste to Mavis.")).catch(() => showToast("JSON shown below. Copy manually."));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}
</script>
</body>
</html>
