name = "box-beeaa-site"
compatibility_date = "2026-07-29"
pages_build_output_dir = "./dist"

# R2 buckets for Phase 2 (B-en long-tail + Chinese)
# These bindings are exposed to Pages Functions via context.env
[[r2_buckets]]
binding = "BOX_EN_B"
bucket_name = "box-en-b"
preview_bucket_name = "box-en-b"

[[r2_buckets]]
binding = "BOX_ZH"
bucket_name = "box-zh"
preview_bucket_name = "box-zh"

# Workers AI (Paid plan: 10K neurons/day 免费 + 付费扩展)
# 自动按需调用 Llama 3 / embedding 模型
[ai]
binding = "AI"

# Smart Placement (Paid plan)
# Worker 自动部署到用户最近的数据中心, 大幅降低延迟 (尤其对亚洲/欧洲用户)
# Free 计划不支持, 已在 $5/mo 套餐内
[placement]
mode = "smart"

# Non-secret env vars (RESEND_API_KEY 在 Cloudflare Dashboard 加为 Secret)
# 2026-08-01 验证 beeaa.com 后, From 改用 noreply@beeaa.com
[vars]
RESEND_FROM = "onboarding@resend.dev"  # 8/18 W3 临时,等 beeaa.com DNS 验证后换回
RESEND_TO = "kexin@beeaa.com"

# Email Sending: Cloudflare Pages 不支持 send_email binding, 我们用 Resend HTTP API
# FRED 在 https://resend.com 注册 (免费 100/天, 3K/月) → 创建 API key → 在 Pages Dashboard 加 secret RESEND_API_KEY
# 也可以用 Cloudflare Email Service (需独立 Worker + 域名验证) — 见 functions/api/inquiry.js 注释

# === D1 Database 询盘持久化 (2026-08-18 启用) ===
# D1 created via Cloudflare API on 2026-08-18 02:28
[[d1_databases]]
binding = "DB"
database_name = "box-beeaa-inquiries"
database_id = "2e645789-47e9-47c6-8f7f-b5fb0341386f"
preview_database_id = "2e645789-47e9-47c6-8f7f-b5fb0341386f"
migrations_dir = "schema"

# === 4 New R2 Buckets for Multi-Language (2026-08-18 启用) ===
# DE/ES/FR/JA translations
[[r2_buckets]]
binding = "BUCKET_DE"
bucket_name = "box-de"
preview_bucket_name = "box-de"

[[r2_buckets]]
binding = "BUCKET_ES"
bucket_name = "box-es"
preview_bucket_name = "box-es"

[[r2_buckets]]
binding = "BUCKET_FR"
bucket_name = "box-fr"
preview_bucket_name = "box-fr"

[[r2_buckets]]
binding = "BUCKET_JA"
bucket_name = "box-ja"
preview_bucket_name = "box-ja"

# === Admin Token (访问 /api/admin/inquiries 后台) ===
# FRED 在 Pages Dashboard → Settings → Environment variables:
#   Variable: ADMIN_TOKEN
#   Type: Secret
#   Value: 32+ 字符串 (e.g. openssl rand -hex 32)

# === Slack/Discord Webhook 实时通知 (可选) ===
# 如设置 NOTIFY_WEBHOOK, 每条询盘将推送到该 webhook
# 适用于 Slack Incoming Webhook 或 Discord Webhook URL
# FRED 在 Pages Dashboard → Settings → Environment variables:
#   Variable: NOTIFY_WEBHOOK
#   Type: Secret
#   Value: https://hooks.slack.com/services/...
