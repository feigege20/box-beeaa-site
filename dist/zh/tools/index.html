<!DOCTYPE html>
<html lang="zh-Hans" data-theme="drone">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具 | 客信新材料</title>
<meta name="description" content="5 大交互式工具：IP 防护等级选择器、尺寸计算器、材料对比、MOQ 估算、认证匹配。" />
<link rel="canonical" href="https://box.beeaa.com/zh/tools/" />
<link rel="stylesheet" href="/styles/theme.css" />
</head>
<body>
<main style="padding:4rem 0;">
<div class="container" style="max-width:900px;">
<h1>工具</h1>
<p style="color:var(--color-text-muted);margin-bottom:2rem;">5 大交互式工具帮您快速选型</p>
<div class="card-grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));">

<a href="/zh/tools/ip-rating-selector/" class="card card-feature">
  <div class="card-body">
    <h3>IP 防护等级选择器</h3>
    <p>为你的应用选择合适的 IP 防护等级（IP54 / IP65 / IP67 / IP68）。</p>
    <span class="card-cta">打开工具 →</span>
  </div>
</a>

<a href="/zh/tools/case-size-calculator/" class="card card-feature">
  <div class="card-body">
    <h3>防护箱尺寸计算器</h3>
    <p>根据设备尺寸 + 内衬缓冲计算防护箱内部尺寸。</p>
    <span class="card-cta">打开工具 →</span>
  </div>
</a>

<a href="/zh/tools/material-comparator/" class="card card-feature">
  <div class="card-body">
    <h3>PP vs ABS vs PC 材料对比器</h3>
    <p>对比 3 大防护箱工程塑料。</p>
    <span class="card-cta">打开工具 →</span>
  </div>
</a>

<a href="/zh/tools/moq-pricing-estimator/" class="card card-feature">
  <div class="card-body">
    <h3>MOQ 与报价估算器</h3>
    <p>根据数量档位和定制程度估算单价。</p>
    <span class="card-cta">打开工具 →</span>
  </div>
</a>

<a href="/zh/tools/certification-matcher/" class="card card-feature">
  <div class="card-body">
    <h3>认证匹配器</h3>
    <p>为目标市场匹配所需认证（CE / ROHS / FCC / IP67 / MIL-SPEC）。</p>
    <span class="card-cta">打开工具 →</span>
  </div>
</a>

</div>
</div>
</main>
</body>
</html>
